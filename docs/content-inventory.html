    <style>
      :root {
        --bg: #f7f4ef;
        --card: #fff;
        --ink: #1a1814;
        --muted: #6b6458;
        --accent: #2d6a6a;
        --accent-soft: #e8f0f0;
        --live: #2d6a4f;
        --placeholder: #b45309;
        --meta: #5b6b8a;
        --ui: #6b7280;
        --border: #d4cfc4;
        --stack-w: 280px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        font-size: 15px;
        line-height: 1.5;
        color: var(--ink);
        background: var(--bg);
      }
      header.doc-header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--card);
        border-bottom: 1px solid var(--border);
        padding: 1rem 1.5rem;
      }
      header.doc-header h1 {
        margin: 0;
        font-size: 1.15rem;
        font-weight: 600;
      }
      header.doc-header p {
        margin: 0.35rem 0 0;
        color: var(--muted);
        font-size: 0.875rem;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.75rem;
        align-items: center;
      }
      .toolbar label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      .toolbar select,
      .toolbar input {
        font: inherit;
        padding: 0.35rem 0.5rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--card);
      }
      .toolbar input {
        min-width: 12rem;
      }
      .layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 0;
        min-height: calc(100vh - 120px);
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        nav.toc {
          display: none;
        }
      }
      nav.toc {
        border-right: 1px solid var(--border);
        padding: 1rem;
        background: var(--card);
        position: sticky;
        top: 108px;
        align-self: start;
        max-height: calc(100vh - 120px);
        overflow-y: auto;
      }
      nav.toc a {
        display: block;
        padding: 0.35rem 0.5rem;
        color: var(--ink);
        text-decoration: none;
        font-size: 0.875rem;
        border-radius: 4px;
      }
      nav.toc a:hover,
      nav.toc a.active {
        background: var(--accent-soft);
        color: var(--accent);
      }
      main {
        padding: 1.5rem;
        max-width: 1100px;
      }
      .page-panel {
        margin-bottom: 2.5rem;
        scroll-margin-top: 120px;
      }
      .page-panel h2 {
        margin: 0 0 0.25rem;
        font-size: 1.25rem;
      }
      .page-panel .route {
        font-size: 0.8rem;
        color: var(--muted);
        font-family ui-monospace, monospace;
        margin-bottom: 1rem;
      }
      .page-grid {
        display: grid;
        grid-template-columns: var(--stack-w) 1fr;
        gap: 1.5rem;
        align-items: start;
      }
      @media (max-width: 700px) {
        .page-grid {
          grid-template-columns: 1fr;
        }
      }
      .stack {
        border: 2px solid var(--ink);
        border-radius: 6px;
        overflow: hidden;
        background: var(--card);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.06);
      }
      .stack-label {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        text-align: center;
        padding: 0.4rem;
        background: var(--ink);
        color: #fff;
      }
      .stack-block {
        padding: 0.5rem 0.6rem;
        font-size: 0.7rem;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: background 0.15s;
      }
      .stack-block:last-child {
        border-bottom: none;
      }
      .stack-block:hover,
      .stack-block.highlight {
        background: var(--accent-soft);
      }
      .stack-block .name {
        font-weight: 600;
        display: block;
      }
      .stack-block .id {
        font-family: ui-monospace, monospace;
        color: var(--muted);
        font-size: 0.65rem;
      }
      .stack-ornament {
        text-align: center;
        padding: 0.25rem;
        font-size: 0.65rem;
        color: var(--muted);
        background: #faf8f5;
        border-bottom: 1px solid var(--border);
      }
      .zones {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .zone {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--card);
        padding: 0.75rem 1rem;
        scroll-margin-top: 120px;
      }
      .zone.hidden {
        display: none;
      }
      .zone-head {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 0.35rem;
      }
      .zone-id {
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        color: var(--accent);
      }
      .badge {
        font-size: 0.65rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 0.15rem 0.45rem;
        border-radius: 999px;
        font-weight: 600;
      }
      .badge.live {
        background: #d8f3e4;
        color: var(--live);
      }
      .badge.placeholder {
        background: #ffedd5;
        color: var(--placeholder);
      }
      .badge.meta {
        background: #e8ecf4;
        color: var(--meta);
      }
      .badge.ui {
        background: #f3f4f6;
        color: var(--ui);
      }
      .role {
        font-size: 0.75rem;
        color: var(--muted);
      }
      .zone-body {
        margin: 0;
        font-size: 0.95rem;
      }
      .zone-src {
        margin: 0.5rem 0 0;
        font-size: 0.75rem;
        color: var(--muted);
        font-family: ui-monospace, monospace;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        font-size: 0.75rem;
        margin-bottom: 1.5rem;
        color: var(--muted);
      }
    </style>

      function renderStack(page) {
        const stack = document.createElement("div");
        stack.className = "stack";
        const label = document.createElement("div");
        label.className = "stack-label";
        label.textContent = "Top → bottom";
        stack.appendChild(label);

        page.sections.forEach((sec) => {
          if (sec.ornament) {
            const o = document.createElement("div");
            o.className = "stack-ornament";
            o.textContent = "◆ ornament";
            stack.appendChild(o);
            return;
          }
          sec.blocks.forEach((block) => {
            const b = document.createElement("div");
            b.className = "stack-block";
            b.dataset.zone = block.id;
            b.innerHTML = `<span class="name">${sec.stack}: ${block.label}</span><span class="id">${block.id}</span>`;
            b.addEventListener("click", () => {
              document
                .getElementById(`zone-${CSS.escape(block.id)}`)
                ?.scrollIntoView({ behavior: "smooth", block: "center" });
              document
                .querySelectorAll(".stack-block")
                .forEach((el) => el.classList.remove("highlight"));
              b.classList.add("highlight");
            });
            stack.appendChild(b);
          });
        });
        return stack;
      }

      function renderZones(page) {
        const wrap = document.createElement("div");
        wrap.className = "zones";
        page.zones.forEach((z) => {
          const el = document.createElement("article");
          el.className = "zone";
          el.id = `zone-${z.id}`;
          el.dataset.page = page.id;
          el.dataset.status = z.status;
          el.dataset.search =
            `${z.id} ${z.content} ${z.role}`.toLowerCase();
          el.innerHTML = `
            <div class="zone-head">
              <span class="zone-id">${z.id}</span>
              <span class="badge ${z.status}">${z.status}</span>
              <span class="role">${z.role}</span>
            </div>
            <p class="zone-body">${escapeHtml(z.content)}</p>
            <p class="zone-src">${escapeHtml(z.src)}</p>
          `;
          wrap.appendChild(el);
        });
        return wrap;
      }

      function escapeHtml(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      INVENTORY.forEach((page) => {
        const panel = document.createElement("section");
        panel.className = "page-panel";
        panel.id = `page-${page.id}`;
        panel.dataset.page = page.id;
        panel.innerHTML = `<h2>${page.title}</h2><p class="route">${page.route}</p>`;
        const grid = document.createElement("div");
        grid.className = "page-grid";
        grid.appendChild(renderStack(page));
        grid.appendChild(renderZones(page));
        panel.appendChild(grid);
        pagesEl.appendChild(panel);
      });

      function applyFilters() {
        const page = pageFilter.value;
        const status = statusFilter.value;
        const q = searchInput.value.trim().toLowerCase();

        document.querySelectorAll(".page-panel").forEach((panel) => {
          const matchPage = !page || panel.dataset.page === page;
          panel.style.display = matchPage ? "" : "none";
        });

        document.querySelectorAll(".zone").forEach((zone) => {
          const matchPage = !page || zone.dataset.page === page;
          const matchStatus = !status || zone.dataset.status === status;
          const matchSearch = !q || zone.dataset.search.includes(q);
          zone.classList.toggle(
            "hidden",
            !(matchPage && matchStatus && matchSearch)
          );
        });
      }

      pageFilter.addEventListener("change", applyFilters);
      statusFilter.addEventListener("change", applyFilters);
      searchInput.addEventListener("input", applyFilters);

      const observer = new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) {
              const id = e.target.id.replace("page-", "");
              tocEl.querySelectorAll("a").forEach((a) => {
                a.classList.toggle(
                  "active",
                  a.getAttribute("href") === `#page-${id}`
                );
              });
            }
          });
        },
        { rootMargin: "-30% 0px -60% 0px" }
      );
      document.querySelectorAll(".page-panel").forEach((p) => observer.observe(p));
    </script>
  </body>
</html>
